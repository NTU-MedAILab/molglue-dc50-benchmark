name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install exact environment
        run: python -m pip install -e '.[test]'
      - name: Unit tests
        run: pytest -q
      - name: Third-party data boundary
        run: python scripts/check_public_release.py

