[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "molglue-dc50-builder"
version = "1.0.0"
description = "Deterministic builder for a four-source molecular-glue DC50 analysis dataset"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
  {name = "Jinsong Shao", email = "sylershao@gmail.com"},
  {name = "Li Wang", email = "wangli@ntu.edu.cn"},
]
dependencies = [
  "numpy==1.26.4",
  "pandas==2.3.3",
  "rdkit==2023.9.6",
  "scikit-learn==1.3.0",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[project.scripts]
molglue-dc50 = "molglue_dc50.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

